name: Daily Commit

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Update file with timestamp
        run: echo "Last updated: $(date -u)" > last_updated.txt

      - name: Commit and push
        run: |
          git config user.name "munazzaghazali7-hash"
          git config user.email "munazzaghazali7@gmail.com"
          git add last_updated.txt
          git diff --staged --quiet || git commit -m "Daily update: $(date -u +'%Y-%m-%d')"
          git push
