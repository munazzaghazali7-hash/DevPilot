name: Daily Commit

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Make 2 commits
        run: |
          git config user.name "munazzaghazali7-hash"
          git config user.email "munazzaghazali7@gmail.com"
          for i in $(seq 1 6); do
            echo "Update $i: $(date -u)" > last_updated.txt
            git add last_updated.txt
            git commit -m "Daily update $i: $(date -u +'%Y-%m-%d %H:%M:%S')"
          done
          git push
